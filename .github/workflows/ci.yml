name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: driftguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: driftguard_test
          POSTGRES_USER: driftguard
          POSTGRES_PASSWORD: driftguard-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driftguard -d driftguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://driftguard:driftguard-ci-password@127.0.0.1:5432/driftguard_test
      DRIFTGUARD_TEST_DATABASE_URL: postgresql://driftguard:driftguard-ci-password@127.0.0.1:5432/driftguard_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m compileall -q app_api app_worker common_utils migrations tests telemetry_simulator.py
      - run: alembic upgrade head
      - run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
